name: CI

on: 
  push:
      branches:
        - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    
    - name: Delete old directory
      # run: delete old
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        KEY: ${{ secrets.SSHKEY }}
        command_timeout: 200m
        script: |
          cd /home/ubuntu
          rm -r -f videochatapp

    - name: Copy repository content
      uses: appleboy/scp-action@master        
      with:
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        KEY: ${{ secrets.SSHKEY }}
        command_timeout: 200m
        source: "."
        target: "/home/ubuntu/videochatapp"

    - name: Executing remote command
      # run: docker-compose up
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        KEY: ${{ secrets.SSHKEY }}
        command_timeout: 200m
        script: |
          cd videochatapp
          sudo docker-compose down 
          sudo docker image prune -af 
          sudo docker system prune -af
          sudo docker-compose up -d
